<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shopping Buddy Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
      </svg>
      <h1>Shopping Buddy</h1>
    </div>
    <label class="toggle">
      <input type="checkbox" id="enable-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="section">
    <label for="api-url">API Server URL</label>
    <div class="input-group">
      <input type="text" id="api-url" placeholder="http://52.66.205.255:8000">
      <button id="save-url-btn">Save</button>
    </div>
    <div id="url-status" class="status-msg"></div>
  </div>

  <div class="section">
    <label for="inference-quality">Quality · <span id="steps-value" style="color:#c4b5fd;">15</span> steps</label>
    <div style="margin-top: 8px;">
      <input type="range" id="inference-quality" min="10" max="50" step="5" value="15">
      <div class="slider-labels">
        <span>⚡ Fast (10)</span>
        <span>✨ Ultra (50)</span>
      </div>
    </div>
  </div>

  <div class="section">
    <label>Your Photo</label>
    <div class="photo-upload-area" id="photo-area">
      <div id="photo-placeholder">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="M21 15l-5-5L5 21" />
        </svg>
        <span>Upload Photo</span>
      </div>
      <img id="photo-preview" style="display:none;" />
      <input type="file" id="file-input" accept="image/*" hidden>
    </div>
    <button id="change-photo-btn" class="btn-secondary" style="display:none; width:100%; margin-top:10px;">Change Photo</button>
    
    <div class="privacy-note">
      🔒 Your photo is stored locally in your browser only. It is never uploaded to any third-party server.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
